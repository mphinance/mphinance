# Runs next to VaultGuard on Venus. Build from the repo root so the persona and
# corpus paths in the Dockerfile resolve:
#   docker compose -f livekit/docker-compose.yml up -d --build
services:
  michael-protege:
    build:
      context: ..
      dockerfile: livekit/Dockerfile
    env_file: .env
    restart: unless-stopped
    # Agents dial out to LiveKit Cloud; nothing listens inbound, so no ports.
