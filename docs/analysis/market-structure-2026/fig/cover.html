<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.card{height:680px;padding:0;background:radial-gradient(700px 520px at 78% 50%,rgba(232,183,90,.20),transparent 65%),radial-gradient(600px 400px at 0% 100%,rgba(180,140,255,.14),transparent 60%),#05070b}
.txt{position:absolute;left:64px;top:92px;width:560px}
.big{font-weight:900;font-size:92px;line-height:.92;letter-spacing:-.035em}
.big em{font-style:normal;color:#E8B75A;display:block}
.tag{max-width:470px;margin-top:26px;font-size:21px;color:#aab0bf;line-height:1.4}
.chips{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.chips span{font:700 13px 'JetBrains Mono',monospace;letter-spacing:.1em;padding:7px 12px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
svg{position:absolute;right:40px;top:40px}
.yr{position:absolute;left:64px;bottom:44px;font:700 14px 'JetBrains Mono',monospace;letter-spacing:.3em;color:#646b7c}
.yr b{color:#E8B75A}
</style></head><body><div class="card">
<div class="txt"><div class="kicker">2026 market structure</div>
<div class="big" style="margin-top:16px">The bell<em>is dead.</em></div>
<div class="tag">Stock futures, pre-market options, perps, and 23-hour stock trading. What changed, what's coming, and where it bites.</div>
<div class="chips"><span style="--c:#c4c9d4">OUTER → INNER</span><span style="--c:#c4c9d4">STOCKS · FUTURES · PERPS · INDEX OPT · STOCK OPT</span></div></div>
<svg id="s" width="600" height="600" viewBox="-340 -340 680 680"></svg>
<div class="yr">MPHINANCE · <b>NOV 2026</b></div>
</div>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e};
// angle: midnight at top, clockwise, 24h
const P=(h,r)=>{const a=(h/24)*2*Math.PI-Math.PI/2;return[r*Math.cos(a),r*Math.sin(a)]};
const arc=(a,b,r,c,w,op=1)=>{if(b<=a)b+=24;const[x1,y1]=P(a,r),[x2,y2]=P(b-0.0001,r);const L=(b-a)>12?1:0;
 el('path',{d:`M${x1} ${y1} A${r} ${r} 0 ${L} 1 ${x2} ${y2}`,stroke:c,'stroke-width':w,fill:'none','stroke-linecap':'butt',opacity:op})};
const rings=[[268,[[21,4,'#B48CFF'],[4,9.5,'#6FA8FF'],[9.5,16,'#E8B75A'],[16,20,'#6FA8FF']]],
 [228,[[18,17,'#2FD18B']]],[188,[[0,24,'#FF5D6C']]],
 [148,[[20.25,9.4167,'#B48CFF'],[9.5,16.25,'#E8B75A'],[16.25,17,'#6FA8FF']]],
 [108,[[7.5,9.4167,'#6FA8FF'],[9.5,16,'#E8B75A'],[16,16.25,'#6FA8FF']]]];
rings.forEach(([r,segs])=>{el('circle',{r,fill:'none',stroke:'rgba(255,255,255,.05)','stroke-width':26});segs.forEach(([a,b,c])=>arc(a,b,r,c,26,.92))});
for(let h=0;h<24;h++){const[x1,y1]=P(h,292),[x2,y2]=P(h,h%6?298:306);el('line',{x1,y1,x2,y2,stroke:h%6?'#3a4050':'#E8B75A','stroke-width':h%6?2:3})}
[['12a',0],['6a',6],['12p',12],['6p',18]].forEach(([t,h])=>{const[x,y]=P(h,316);const e=el('text',{x,y:y+5,'text-anchor':'middle',fill:'#c4c9d4','font-family':'JetBrains Mono','font-size':14,'font-weight':700});e.textContent=t});
const labs=[['STOCKS',268],['FUTURES',228],['PERPS',188],['INDEX OPT',148],['STOCK OPT',108]];
//labs.forEach(([t,r])=>{const e=el('text',{x:6,y:-r+5,fill:'#07090e','font-family':'JetBrains Mono','font-size':11,'font-weight':800});e.textContent=t});
const c=el('text',{x:0,y:8,'text-anchor':'middle',fill:'#E8B75A','font-family':'Inter','font-size':44,'font-weight':900});c.textContent='23x5';
const c2=el('text',{x:0,y:34,'text-anchor':'middle',fill:'#8b90a0','font-family':'JetBrains Mono','font-size':12,'font-weight':700});c2.textContent='ET · DEC 6';
</script></body></html>
