<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker resume deck</title>
<meta name="description" content="56 people across 32 brokers, mined from mphinance/awesome-broker-mcp.">
<style>
:root{--bg:#0e0f10;--ink:#e8e4da;--mute:#8f8b80;--line:#26282a;--accent:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Charter,"Iowan Old Style",Georgia,serif}
a{color:var(--ink);text-decoration-color:var(--mute);text-underline-offset:3px}
a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;letter-spacing:.02em;color:var(--mute)}
header{max-width:960px;margin:0 auto;padding:40px 24px 28px;border-bottom:1px solid var(--line)}
h1{margin:14px 0 8px;font-size:clamp(30px,5vw,46px);line-height:1.1;font-weight:600}
header p{margin:0;max-width:60ch;color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:0 24px 64px}
figure{margin:36px 0 0}
figure img{display:block;width:100%;height:auto;background:#17191a;border:1px solid var(--line)}
figcaption{margin-top:8px}
footer{max-width:960px;margin:0 auto;padding:0 24px 48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<header>
  <a class="mono" href="../">&larr; all artifacts</a>
  <h1>Broker resume deck</h1>
  <p>56 people across 32 brokers, mined from mphinance/awesome-broker-mcp.</p>
  <p class="mono" style="margin-top:12px"><time datetime="2026-11-20">2026-11-20</time> &middot; 7 pages</p>
  <p class="mono" style="margin-top:8px"><a href="data.md" download>download data.md</a> &middot; every person, broker and repo as plain markdown</p>
</header>
<main>
  <figure><img src="01-cover.png" alt="Deck cover" width="1600" height="2400"><figcaption class="mono">01 / 07 &middot; cover</figcaption></figure>
  <figure><img src="02-page-01.png" alt="Deck page 1" width="1600" height="2400" loading="lazy"><figcaption class="mono">02 / 07 &middot; page 1</figcaption></figure>
  <figure><img src="03-page-02.png" alt="Deck page 2" width="1600" height="2400" loading="lazy"><figcaption class="mono">03 / 07 &middot; page 2</figcaption></figure>
  <figure><img src="04-page-03.png" alt="Deck page 3" width="1600" height="2400" loading="lazy"><figcaption class="mono">04 / 07 &middot; page 3</figcaption></figure>
  <figure><img src="05-page-04.png" alt="Deck page 4" width="1600" height="2400" loading="lazy"><figcaption class="mono">05 / 07 &middot; page 4</figcaption></figure>
  <figure><img src="06-page-05.png" alt="Deck page 5" width="1600" height="2400" loading="lazy"><figcaption class="mono">06 / 07 &middot; page 5</figcaption></figure>
  <figure><img src="07-roster.png" alt="Full roster" width="1600" height="2400" loading="lazy"><figcaption class="mono">07 / 07 &middot; roster</figcaption></figure>
</main>
<footer><a class="mono" href="../">&larr; all artifacts</a></footer>
</body>
</html>
