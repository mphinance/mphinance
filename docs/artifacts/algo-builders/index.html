.wrap{max-width:900px;margin:0 auto;padding:0 20px 90px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
header{padding:60px 0 34px;border-bottom:1px solid var(--line)}
.stat{display:flex;flex-wrap:wrap;gap:12px 64px;margin:0}

h2{font-size:22px;margin:0 0 6px}
.sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.chip[aria-pressed=true] i{color:var(--gold)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;margin:22px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sort button{background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);font:inherit;font-size:15px;padding:0 0 1px;margin-left:16px;cursor:pointer}
.sort button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--gold)}
.person{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ph h3{margin:0;font-size:21px}
.ph .nm{font-size:17px}
.pm{margin:2px 0 0;font-size:14px;color:var(--muted)}
.pm span+span:before{content:", "}
.nums{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bio{margin:6px 0 0;font-size:15px;color:var(--muted);max-width:44em}
.repos{list-style:none;margin:12px 0 0;padding:0}
.repo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;padding:7px 0 7px 12px;border-left:2px solid var(--line)}
.repo.best{border-left-color:var(--gold)}
.repo.dim{opacity:.5}
.rn{font-weight:700;overflow-wrap:anywhere}
.rn a{text-decoration:none}
.rn a:hover{text-decoration:underline;text-decoration-color:var(--gold)}
.best .rn:after{content:"best";font:400 11px var(--mono);color:var(--gold);margin-left:8px}
.rm{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;align-self:baseline}
.rd{grid-column:1/-1;font-size:15px;color:var(--muted);margin-top:1px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);padding:0 5px;margin-left:8px;border-radius:2px;font-weight:400;white-space:nowrap}
.more{margin:8px 0 0 14px;font-size:14px;color:var(--muted)}
.org .repo{border-left-color:var(--line)}
.empty{padding:30px 0;color:var(--muted)}
footer{margin-top:44px;font-size:14px;color:var(--muted)}
@media(max-width:560px){.repo{grid-template-columns:1fr}.rm{text-align:left}.nums{margin-left:0;width:100%}}
</style>
</head>
