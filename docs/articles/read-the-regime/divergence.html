<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0a0e14; --card:#0e131c; --ink:#e8ecf2; --muted:#8b95a5;
    --amber:#f5a623; --green:#16c784; --red:#ea3943; --grid:#1b2230;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:-apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .wrap{width:940px;padding:34px 38px 30px;background:var(--bg)}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:700}
  h1{font-size:30px;line-height:1.15;margin:8px 0 6px;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:15px;color:var(--muted);line-height:1.45;max-width:820px}
  .panels{margin-top:22px}
  .chart{display:block}
  .foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  .foot b{color:var(--ink)}
  .legend{display:flex;gap:20px;align-items:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Read the regime</div>
  <h1>Same setup. Two afternoons. The flip decides which.</h1>
  <p class="sub">Identical open. Identical climb into the same wall by lunch. The only thing that changed is which gamma regime the market was in when price got there.</p>
  <div class="panels"><svg id="svg" class="chart" width="864" height="620" viewBox="0 0 864 620"></svg></div>
  <div class="foot">
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>up bar</span>
      <span><span class="dot" style="background:var(--red)"></span>down bar</span>
      <span><span class="dot" style="background:var(--amber)"></span>GEX wall</span>
      <span><span class="dot" style="background:#5b6675"></span>gamma flip</span>
    </div>
    <div><b>mphinance</b> · illustrative</div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function txt(x,y,s,a){const e=el("text",Object.assign({x,y},a));e.textContent=s;svg.appendChild(e);return e;}

// shared morning closes (0..12): climb to the wall
const shared=[750.4,750.7,750.5,751.0,751.3,751.1,751.6,752.0,751.8,752.3,752.6,752.8,753.0];
// positive-GEX afternoon: rejected, ranges under the wall
const tailPos=[752.6,752.2,751.7,751.2,750.8,751.1,750.6,750.9,750.5,750.8,751.0,750.7,750.9];
// negative-GEX afternoon: breaks the wall, trends
const tailNeg=[753.4,753.9,754.3,754.1,754.8,755.4,755.2,756.0,756.7,757.1,757.6,758.0,758.4];

const WALL=753.0, FLIP=749.86;

function series(tail,jit){
  const closes=shared.concat(tail);
  const bars=[]; let prev=750.2;
  for(let i=0;i<closes.length;i++){
    const c=closes[i]; const o=prev;
    const hi=Math.max(o,c)+jit(i,0.18,0.9); const lo=Math.min(o,c)-jit(i,0.18,0.9);
    bars.push({o,c,hi,lo}); prev=c;
  }
  return bars;
}
// tight wicks in the shared+range region, wider once trending
const jitPos=(i,base)=> base + (i>12? 0.05:0.10);
const jitNeg=(i,base)=> base + (i>12? 0.40:0.10);

const posBars=series(tailPos,jitPos);
const negBars=series(tailNeg,jitNeg);

const PLOT_L=58, PLOT_R=792, N=posBars.length;
const step=(PLOT_R-PLOT_L)/N, cw=Math.min(15, step*0.56);
// SHARED y-scale so the morning is pixel-identical in both panels
const LO=748.4, HI=759.6;

function panel(y0,h,bars,cfg){
  const PLOT_T=y0+34, PLOT_B=y0+h-26;
  const Y=v=> PLOT_B-(v-LO)/(HI-LO)*(PLOT_B-PLOT_T);
  // frame
  svg.appendChild(el("rect",{x:PLOT_L-24,y:y0,width:PLOT_R-PLOT_L+86,height:h,rx:10,fill:"#0e131c",stroke:"#1b2230","stroke-width":1}));
  // gridlines at even dollars
  for(let g=750;g<=758;g+=2){
    svg.appendChild(el("line",{x1:PLOT_L,x2:PLOT_R,y1:Y(g),y2:Y(g),stroke:"#161d29","stroke-width":1}));
    txt(PLOT_R+10,Y(g)+3,String(g),{fill:"#5b6675","font-size":10});
  }
  // flip line (label below the line, clear of the candles above it)
  svg.appendChild(el("line",{x1:PLOT_L,x2:PLOT_R,y1:Y(FLIP),y2:Y(FLIP),stroke:"#5b6675","stroke-width":1.4,"stroke-dasharray":"2 4"}));
  txt(PLOT_L+2,Y(FLIP)+14,"GAMMA FLIP 749.86",{fill:"#7c8797","font-size":10,"letter-spacing":".08em","font-weight":700});
  // wall line (label left, above line — clear of the low morning candles)
  svg.appendChild(el("line",{x1:PLOT_L,x2:PLOT_R,y1:Y(WALL),y2:Y(WALL),stroke:"#f5a623","stroke-width":1.4,"stroke-dasharray":"5 4","opacity":0.9}));
  txt(PLOT_L+2,Y(WALL)-6,cfg.wallLabel,{fill:"#f5a623","font-size":10.5,"letter-spacing":".05em","font-weight":700});
  // divider between morning and afternoon
  const xDiv=PLOT_L+13*step;
  svg.appendChild(el("line",{x1:xDiv,x2:xDiv,y1:PLOT_T,y2:PLOT_B,stroke:"#3a4454","stroke-width":1,"stroke-dasharray":"3 4"}));
  txt(xDiv-6,PLOT_T+11,"same setup",{fill:"#6b7585","font-size":9.5,"text-anchor":"end","letter-spacing":".04em"});
  txt(xDiv+6,PLOT_T+11,"the fork",{fill:"#6b7585","font-size":9.5,"letter-spacing":".04em"});
  // candles
  bars.forEach((b,i)=>{
    const x=PLOT_L+step*i+step/2; const up=b.c>=b.o; const col=up?"#16c784":"#ea3943";
    svg.appendChild(el("line",{x1:x,x2:x,y1:Y(b.hi),y2:Y(b.lo),stroke:col,"stroke-width":1.4}));
    const yt=Y(Math.max(b.o,b.c)), yb=Y(Math.min(b.o,b.c));
    svg.appendChild(el("rect",{x:x-cw/2,y:yt,width:cw,height:Math.max(1.5,yb-yt),fill:col,rx:1}));
  });
  // panel title chip (sized to text)
  svg.appendChild(el("rect",{x:PLOT_L-24,y:y0,width:cfg.chipW,height:26,rx:10,fill:cfg.chip}));
  txt(PLOT_L-12,y0+17,cfg.title,{fill:"#0a0e14","font-size":12.5,"font-weight":800,"letter-spacing":".02em"});
  // outcome tag on the right
  const tw=cfg.tagW, tx=PLOT_R-tw-6, ty=y0+40;
  svg.appendChild(el("rect",{x:tx,y:ty,width:tw,height:38,rx:8,fill:cfg.tagBg,stroke:cfg.tagStroke,"stroke-width":1}));
  txt(tx+12,ty+16,cfg.tag1,{fill:cfg.tagInk,"font-size":12,"font-weight":800});
  txt(tx+12,ty+31,cfg.tag2,{fill:"#c3cbd6","font-size":11});
  return {Y,xDiv};
}

// TOP: positive GEX
panel(18,278,posBars,{
  title:"POSITIVE GEX · dealers on the leash",
  chip:"#16c784", chipW:320,
  wallLabel:"GEX WALL 753 — ceiling",
  tag1:"Rejected at the wall → range",
  tag2:"The covered-call day. Sell premium.",
  tagBg:"rgba(22,199,132,.12)", tagStroke:"rgba(22,199,132,.55)", tagInk:"#16c784", tagW:248
});

// BOTTOM: negative GEX
panel(322,278,negBars,{
  title:"NEGATIVE GEX · leash off",
  chip:"#ea3943", chipW:236,
  wallLabel:"GEX WALL 753 — launchpad",
  tag1:"Broke the wall → trend",
  tag2:"The momentum day. Go with it.",
  tagBg:"rgba(234,57,67,.12)", tagStroke:"rgba(234,57,67,.55)", tagInk:"#ea3943", tagW:236
});
</script>
</body>
</html>
