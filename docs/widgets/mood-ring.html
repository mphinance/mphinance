<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Mood Ring — Alpha.HUD Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(14, 14, 22, 0.97);
            --border: #2a2a35;
            --green: #00ff41;
            --amber: #f0b400;
            --danger: #e53935;
            --blue: #00f3ff;
            --text: #e0e0e0;
            --dim: #888;
            --muted: #555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            color: var(--text);
            background-image:
                linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.22) 50%),
                linear-gradient(90deg, rgba(255,0,0,.04), rgba(0,255,0,.02), rgba(0,0,255,.04));
            background-size: 100% 2px, 3px 100%;
        }
        .widget { max-width: 700px; margin: 0 auto; }

        /* ── Header ── */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .header .title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px; font-weight: 700;
            letter-spacing: .18em; text-transform: uppercase;
            color: var(--blue);
        }
        .header .ts { font-size: 9px; color: var(--muted); }

        /* ── Main regime display ── */
        .regime-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .regime-left { display: flex; align-items: center; gap: 12px; }
        .regime-emoji { font-size: 26px; line-height: 1; }
        .regime-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px; font-weight: 800;
            letter-spacing: .12em; text-transform: uppercase;
        }
        .regime-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .15em; margin-top: 2px; }
        .regime-right { text-align: right; }
        .vix-big { font-size: 20px; font-weight: 700; font-family: 'Share Tech Mono', monospace; }
        .vix-label { font-size: 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; }
        .spy-change { font-size: 11px; margin-top: 3px; }

        /* ── Dot strip ── */
        .strip-section {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
        }
        .strip-label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .15em; margin-bottom: 6px; }
        .dots {
            display: flex; gap: 4px; align-items: flex-end;
            overflow-x: auto; scrollbar-width: none;
        }
        .dots::-webkit-scrollbar { display: none; }
        .dot-col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
        .dot {
            width: 18px; height: 18px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.08);
            cursor: default; transition: transform .15s;
            position: relative;
        }
        .dot:hover { transform: scale(1.25); }
        .dot-date { font-size: 7px; color: var(--muted); }
        .dot-current { box-shadow: 0 0 8px currentColor; }

        /* ── Sparkline ── */
        .spark-section {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
        }
        .spark-label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .15em; margin-bottom: 4px; }
        canvas#spark { display: block; }

        /* ── Footer ── */
        .footer {
            background: var(--panel);
            padding: 5px 14px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .footer a { font-size: 8px; color: var(--muted); text-decoration: none; }
        .footer a:hover { color: var(--blue); }
        .verdict-pill {
            font-size: 9px; padding: 2px 8px; border-radius: 2px;
            border: 1px solid; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
        }

        /* ── Empty / error ── */
        .empty { padding: 30px; text-align: center; color: var(--muted); font-size: 11px; }
    </style>
</head>
<body>
<div class="widget" id="widget">
    <div class="header">
        <span class="title">MARKET.MOOD.RING <span style="color:var(--blue)">●</span> GHOST ALPHA</span>
        <span class="ts" id="ts">—</span>
    </div>
    <div id="main"><div class="empty">Loading…</div></div>
</div>

<script>
// ── Data URL: relative (GH Pages) with absolute fallback ──
const DATA_URLS = [
    '../data/regime_history.json',
    'https://mphinance.github.io/mphinance/data/regime_history.json',
];

const MOOD = {
    CALM:     { color: '#00ff41', emoji: '😎', label: 'Risk-On',  verdict: 'TRADE' },
    NORMAL:   { color: '#00ff41', emoji: '🙂', label: 'Risk-On',  verdict: 'TRADE' },
    ELEVATED: { color: '#f0b400', emoji: '😐', label: 'Caution',  verdict: 'CAUTION' },
    FEAR:     { color: '#e53935', emoji: '😨', label: 'Risk-Off', verdict: 'AVOID' },
    PANIC:    { color: '#e53935', emoji: '😱', label: 'Risk-Off', verdict: 'AVOID' },
};
const UNKNOWN = { color: '#888888', emoji: '❓', label: 'Unknown', verdict: '—' };

function moodFor(regime) {
    return MOOD[(regime || '').toUpperCase()] || UNKNOWN;
}

function fmtDate(iso) {
    if (!iso) return '';
    const [, , d] = iso.split('-');
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const mo = parseInt(iso.split('-')[1]) - 1;
    return `${m[mo]}${parseInt(d, 10)}`;
}

function drawSparkline(canvas, entries) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const pad = 4;
    const vals = entries.map(e => parseFloat(e.vix_level) || 0).filter(v => v > 0);
    if (vals.length < 2) return;
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const range = mx - mn || 1;
    ctx.clearRect(0, 0, W, H);

    // Grid line at threshold 20
    const y20 = H - pad - ((20 - mn) / range) * (H - 2 * pad);
    if (y20 > pad && y20 < H - pad) {
        ctx.strokeStyle = 'rgba(240,180,0,0.2)';
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y20); ctx.lineTo(W, y20); ctx.stroke();
        ctx.setLineDash([]);
    }

    // VIX sparkline
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#00f3ff';
    ctx.beginPath();
    vals.forEach((v, i) => {
        const x = pad + (i / (vals.length - 1)) * (W - 2 * pad);
        const y = H - pad - ((v - mn) / range) * (H - 2 * pad);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Latest dot
    const lastV = vals[vals.length - 1];
    const lastX = W - pad;
    const lastY = H - pad - ((lastV - mn) / range) * (H - 2 * pad);
    ctx.fillStyle = '#00f3ff';
    ctx.beginPath(); ctx.arc(lastX, lastY, 3, 0, Math.PI * 2); ctx.fill();

    // Min/max labels
    ctx.fillStyle = '#555';
    ctx.font = '7px JetBrains Mono, monospace';
    ctx.fillText(`VIX ${mn.toFixed(1)}`, 2, H - 2);
    ctx.fillText(`${mx.toFixed(1)}`, 2, 9);
}

function render(history) {
    if (!history || !history.length) {
        document.getElementById('main').innerHTML = '<div class="empty">No regime history yet — run the pipeline first.</div>';
        return;
    }

    const current = history[history.length - 1];
    const m = moodFor(current.regime);
    const strip = history.slice(-20);  // show last 20 trading days
    const today = current.date || '';

    // Update timestamp
    document.getElementById('ts').textContent = today;

    // Verdict pill styles
    const verdictColor = m.color;
    const verdictBorder = verdictColor;

    // SPY change
    const spy = parseFloat(current.spy_change);
    const spyStr = isNaN(spy) ? '—' : `SPY ${spy >= 0 ? '+' : ''}${spy.toFixed(2)}%`;
    const spyColor = isNaN(spy) ? '#888' : spy >= 0 ? '#00ff41' : '#f0b400';

    let html = `
    <div class="regime-row">
      <div class="regime-left">
        <div class="regime-emoji">${m.emoji}</div>
        <div>
          <div class="regime-name" style="color:${m.color}">${current.regime || 'UNKNOWN'}</div>
          <div class="regime-label">${m.label}</div>
        </div>
      </div>
      <div class="regime-right">
        <div class="vix-big" style="color:${m.color}">VIX ${parseFloat(current.vix_level || 0).toFixed(2)}</div>
        <div class="vix-label">implied volatility index</div>
        <div class="spy-change" style="color:${spyColor}">${spyStr}</div>
      </div>
    </div>

    <div class="strip-section">
      <div class="strip-label">20-Day Market Mood Strip</div>
      <div class="dots" id="dots">`;

    strip.forEach(e => {
        const em = moodFor(e.regime);
        const isCurrent = e.date === today;
        const vix = parseFloat(e.vix_level || 0).toFixed(1);
        html += `<div class="dot-col">
          <div class="dot${isCurrent ? ' dot-current' : ''}"
               style="background:${em.color}; color:${em.color};"
               title="${e.date} — ${e.regime} (VIX ${vix})"></div>
          <div class="dot-date">${fmtDate(e.date)}</div>
        </div>`;
    });

    html += `</div></div>
    <div class="spark-section">
      <div class="spark-label">VIX 20-Day Trend <span style="color:#555;margin-left:8px">— dashed line = VIX 20</span></div>
      <canvas id="spark" width="672" height="36"></canvas>
    </div>
    <div class="footer">
      <a href="https://mphinance.com" target="_blank">mphinance.com</a>
      <span class="verdict-pill" style="color:${verdictColor};border-color:${verdictBorder}">${m.verdict}</span>
    </div>`;

    document.getElementById('main').innerHTML = html;
    drawSparkline(document.getElementById('spark'), strip);
}

async function load() {
    for (const url of DATA_URLS) {
        try {
            const r = await fetch(url);
            if (!r.ok) continue;
            const data = await r.json();
            if (Array.isArray(data) && data.length) { render(data); return; }
        } catch (_) { /* try next */ }
    }
    document.getElementById('main').innerHTML = '<div class="empty">Regime data unavailable.</div>';
}

load();
</script>
</body>
</html>
