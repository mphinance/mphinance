name: CI

# Runs the pytest suite on every PR to main. This is the green gate the
# autonomous loop waits on before it auto-merges its nightly feature PR — so a
# change that breaks a test stays an open PR instead of landing on main.
# Direct pushes to main (dossier, ghost, holdings) are intentionally NOT gated:
# this triggers on pull_request only, and main has no required-status branch
# protection.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when the PR gets new commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (error-class rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install ruff

      # E9 = syntax/IO errors, F63 = invalid comparisons/asserts, F7 = misplaced
      # statements, F82 = undefined names. Style rules are intentionally excluded.
      - name: Ruff check
        run: ruff check --select E9,F63,F7,F82 .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q
