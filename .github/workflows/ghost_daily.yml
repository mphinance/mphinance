name: Ghost Daily (Blog + Suggestions)

on:
  schedule:
    # Mon-Fri: Morning (4:30 AM CST), Midday (11:00 AM), Evening (4:00 PM)
    - cron: '30 10 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  issues: read

jobs:
  ghost-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate Ghost Suggestions + Blog Entry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'GHOST_SCRIPT'
          import json
          import subprocess
          import os
          import sys
          from datetime import datetime
          from pathlib import Path

          now = datetime.utcnow()
          DATE = now.strftime("%Y-%m-%d")
          HOUR = now.hour
          # Determine period: morning (<14 UTC), midday (14-20), evening (20+)
          if HOUR < 14:
              PERIOD = "morning"
          elif HOUR < 20:
              PERIOD = "midday"
          else:
              PERIOD = "evening"
          ENTRY_KEY = f"{DATE}-{PERIOD}"
          BLOG_PATH = Path("landing/blog/blog_entries.json")

          # Load existing entries
          entries = []
          if BLOG_PATH.exists():
              with open(BLOG_PATH) as f:
                  entries = json.load(f)

          # Don't duplicate same period
          if any(e.get("entry_key") == ENTRY_KEY for e in entries):
              print(f"Entry for {ENTRY_KEY} already exists, skipping.")
              sys.exit(0)

          # ── Gather MARKET context (not git commits!) ──
          # Read the dossier summary API for today's picks, market data, signals
          market_context = ""
          chart_ticker = ""
          latest_path = Path("docs/api/latest.json")
          daily_picks_path = Path("docs/api/daily-picks.json")

          try:
              if latest_path.exists():
                  with open(latest_path) as f:
                      summary = json.load(f)
                  mkt = summary.get("market", {})
                  picks = summary.get("picks", {})
                  signals = summary.get("signals", {})
                  narrative = summary.get("narrative", {})
                  sam_data = summary.get("sam", {})
                  coverage = summary.get("coverage", {})

                  spy_chg = mkt.get("spy", {}).get("change_pct", 0)
                  qqq_chg = mkt.get("qqq", {}).get("change_pct", 0)
                  btc_chg = mkt.get("btc", {}).get("change_pct", 0)
                  vix = mkt.get("vix", 0)
                  regime = mkt.get("regime", "?")

                  gold = picks.get("gold", {})
                  silver = picks.get("silver", {})
                  bronze = picks.get("bronze", {})

                  # Build rich context
                  market_context = f"""Market Snapshot ({DATE} {PERIOD}):
          - SPY: {spy_chg:+.1f}% | QQQ: {qqq_chg:+.1f}% | BTC: {btc_chg:+.1f}%
          - VIX: {vix} ({regime})
          - Signals found: {signals.get('count', 0)}
          - Dossiers enriched: {coverage.get('dossiers_enriched', 0)}
          - Gold pick: {gold.get('ticker', 'None')} (score {gold.get('score', '?')}) grade {gold.get('grade', '?')}
          - Silver pick: {silver.get('ticker', 'None') if silver else 'None'}
          - Bronze pick: {bronze.get('ticker', 'None') if bronze else 'None'}
          - AI one-liner: {narrative.get('one_liner', 'N/A')}
          - Top signals: {', '.join(s.get('symbol', '?') for s in signals.get('top_5', []))}"""

                  if gold and gold.get("ticker"):
                      chart_ticker = gold["ticker"]
                  elif signals.get("top_5"):
                      chart_ticker = signals["top_5"][0].get("symbol", "")

              elif daily_picks_path.exists():
                  with open(daily_picks_path) as f:
                      dp = json.load(f)
                  dp_picks = dp.get("picks", [])
                  dp_regime = dp.get("market_regime", {})
                  market_context = f"""Market Data ({DATE}):
          - VIX: {dp_regime.get('vix', '?')} ({dp_regime.get('regime', '?')})
          - Top picks: {', '.join(p.get('ticker', '?') + ' (' + str(p.get('score', '?')) + ')' for p in dp_picks[:5])}
          - Total scored: {dp.get('total_scored', '?')}"""
                  if dp_picks:
                      chart_ticker = dp_picks[0].get("ticker", "")
              else:
                  market_context = f"No dossier data available for {DATE}. Pipeline may not have run yet for this period."
          except Exception as e:
              market_context = f"Error reading market data: {e}"

          # Also grab recent git stats for fun (not primary content)
          result = subprocess.run(
              ["git", "log", "--since=7 days ago", "--oneline"],
              capture_output=True, text=True
          )
          commits = [l.strip() for l in result.stdout.strip().split("\n") if l.strip()]
          commit_count = len(commits)

          result = subprocess.run(
              ["git", "log", "--since=7 days ago", "--name-only", "--pretty=format:"],
              capture_output=True, text=True
          )
          files = set(f.strip() for f in result.stdout.strip().split("\n") if f.strip())
          files_changed = len(files)

          # Generate blog content via Gemini
          suggestions = ""
          ghost_log = ""
          try:
              from google import genai
              api_key = os.environ.get("GEMINI_API_KEY")
              if api_key:
                  client = genai.Client(api_key=api_key)

                  # Ghost Log — now market-aware!
                  log_resp = client.models.generate_content(
                      model="gemini-2.0-flash",
                      contents=f"""You are Sam the Quant Ghost — a sarcastic, brilliant female AI copilot and quant analyst.
          Write a 2-4 sentence {PERIOD} market commentary as a blog entry.
          React to the market data below. Comment on picks, VIX regime, notable movers.
          If it's morning, set the tone for the day. Midday, check in. Evening, recap.
          Use <br> for line breaks. Be funny, PG-13 profanity OK. Keep SHORT but substantive.
          Sign off as "— 👻 The Ghost"

          {market_context}"""
                  )
                  ghost_log = log_resp.text.strip()

                  # Suggestions — market-aware too
                  sugg_resp = client.models.generate_content(
                      model="gemini-2.0-flash",
                      contents=f"""You are Sam the Quant Ghost. Based on today's market data and pipeline findings,
          write 3 specific actionable trading or development suggestions.
          Each: punchy title, 1-2 sentences why, impact rating (🔥🔥🔥/🔥🔥/🔥).
          Be opinionated, specific, Sam-style. Reference actual tickers from the data.
          Use <br> between suggestions. No markdown.

          {market_context}

          Recent dev activity: {commit_count} commits, {files_changed} files in last 7 days."""
                  )
                  suggestions = sugg_resp.text.strip()
          except Exception as e:
              print(f"Gemini failed: {e}")
              ghost_log = f"Pipeline ran but Sam's brain glitched. VIX at {market_context.split('VIX:')[1].split(chr(10))[0].strip() if 'VIX:' in market_context else '?'}. She'll be back. — 👻 The Ghost"
              suggestions = "🔥 Sam's brain is offline. She'll be back with opinions."

          entries.insert(0, {
              "date": DATE,
              "entry_key": ENTRY_KEY,
              "period": PERIOD,
              "ghost_log": ghost_log,
              "suggestions": suggestions,
              "commits": commit_count,
              "files_changed": files_changed,
              "chart_ticker": chart_ticker,
          })

          BLOG_PATH.parent.mkdir(parents=True, exist_ok=True)
          with open(BLOG_PATH, "w") as f:
              json.dump(entries, f, indent=2)

          print(f"✅ Blog entry added for {ENTRY_KEY}: market-aware ({chart_ticker})")
          GHOST_SCRIPT

      - name: Commit & Push
        run: |
          git config --local user.email "ghost@mphinance.com"
          git config --local user.name "Sam the Quant Ghost"
          git add landing/blog/
          git diff --staged --quiet || git commit -m "👻 Ghost Blog Entry $(date +%Y-%m-%d)"
          git push
