name: Claude Mention

# Summon Claude with "@claude ..." in an issue, an issue/PR comment, a PR review,
# or by assigning an issue to it. Claude runs in the repo with file + CI access
# and can answer, review a PR, or implement a change and push a branch / open a PR.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (driven off the Pro/Max
# subscription, configured by `/install-github-app`). If @claude goes silent,
# check that secret first — the token expires and may need re-running the flow.
#
# Project conventions live in .github/CLAUDE.md (loaded below). The root
# CLAUDE.md redirects to AGENTS.md, which is the local-agent ops manual and is
# deliberately NOT the brief for this bot — see .github/CLAUDE.md for why.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only spend a run when "@claude" is actually present in the trigger text.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create branches / commits when asked to implement
      pull-requests: write   # open PRs, post review comments
      issues: write          # comment on issues
      id-token: write        # OIDC (required by the action)
      actions: read          # read CI results on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "Before acting, read .github/CLAUDE.md and follow it. It is the project brief for the GitHub bot. Do NOT perform the local-agent rituals described in AGENTS.md (no ghost blog entries, no GHOST_HANDOFF.md or blog_entries.json edits)."
