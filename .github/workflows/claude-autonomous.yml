name: Claude Autonomous Loop

# A self-driving improvement loop. Every night it finds ONE small, safe, concrete
# improvement to the repo, ships it as a PR, waits for the `pytest` CI check
# (.github/workflows/ci.yml), and SQUASH-MERGES it on green. If CI is red the PR
# is left OPEN for review and nothing lands.
#
# It is FREE-FORM, not a fixed queue: it reads .github/CLAUDE.md (conventions,
# pitfalls, and the standing "Ideas / backlog" list) and picks something worth
# doing — so it never runs dry. One PR per night, auto-merged on green: a visible
# trail of merged PRs with zero clicks from you, and no draft graveyard.
#
# Trigger it by hand (Actions tab -> Run workflow) or let the nightly cron run.
# Comment out the `schedule:` block to make it manual-only.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (subscription-driven, set by
# `/install-github-app`). Each run draws on that subscription; one improvement
# per run keeps usage bounded and the PRs reviewable.

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC nightly (~03:00 CST) — off-hours, clear of the morning dossier.
    - cron: '0 9 * * *'

# Don't let two loop runs stomp each other; let an in-flight run finish.
concurrency:
  group: claude-autonomous
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit + push the feature branch, merge the PR
      pull-requests: write   # open / merge the PR
      issues: write          # file a plan issue for risky ideas it won't ship
      id-token: write        # OIDC (required by the action)
      actions: read          # read CI results
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history so the loop can read recent commits

      - name: Ship one improvement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the nightly improvement agent for mphinance — an AI-assisted quantitative
            trading + publishing platform (Python dossier pipeline, a TypeScript/Node
            substack_social package, a static landing site, and one-off scripts). You start with
            ZERO context, so FIRST read .github/CLAUDE.md: it documents the architecture,
            conventions, pitfalls, and a standing "Ideas / backlog" list. Follow it exactly.
            (Read AGENTS.md only for deeper context — do NOT perform its local-agent rituals.)

            YOUR JOB THIS RUN: find and ship exactly ONE small, safe, concrete improvement.
            Rotate focus night to night across these buckets (pick a DIFFERENT bucket than recent
            commits/PRs show): (1) input validation around external APIs in the dossier data-fetch
            stages (the most common source of silent breakage), (2) a small bug fix, (3) resilience
            in substack_social (retries, clearer failures), (4) a new test for an under-covered
            helper, (5) a small new derived signal or stat in the dossier output, (6) stale or
            wrong copy/docs. Prefer items from the "Ideas / backlog" list in .github/CLAUDE.md
            and TODO.md when they fit in one tight, reviewable change.

            HARD RULES:
            - Keep it small and reviewable — ideally under ~150 changed lines, one coherent
              improvement, not a grab-bag. Reuse existing patterns; match the surrounding style.
            - BASELINE FIRST: run `pytest -q` BEFORE you touch anything, to catch pre-existing
              failures. Implement your change. Then re-run `pytest -q` and confirm no regressions.
              If you add behavior, add or extend a test for it. Never claim tests pass when none ran.
            - DO NOT touch secrets, edit .github/workflows/*, or delete generated docs/ artifacts
              (e.g. docs/ticker/*/deep_dive.*). DO NOT perform AGENTS.md local-agent rituals
              (no ghost blog entries, no GHOST_HANDOFF.md or blog_entries.json edits).
            - If an idea is ambiguous or risky (schema change, data deletion, major dependency
              bump, reworking a workflow): do NOT implement it. Open or update an issue with a
              plan instead, and pick something safer — or stop.

            SHIP IT ON GREEN (auto-merge): land your change as a PR that merges itself on green CI.
              a. Start a fresh branch off main: `git fetch origin main` then
                 `git checkout -B autonomous/<short-slug> origin/main`.
              b. `git add -A` for your change's files only (do not stage unrelated changes).
              c. `git commit -m "<type>(<scope>): <what you did>"` (clear conventional message; the
                 repo uses short emoji-prefixed summaries — match that).
              d. `git push -u origin HEAD`.
              e. Open a READY PR (no --draft):
                 `gh pr create --base main --title "<your commit message>" --body "<what changed, why it helps, and how you validated it>"`.
              f. Capture the PR number. Poll `gh pr checks <number>` every ~15s until the `pytest`
                 check is no longer pending/in_progress (give up after ~8 minutes).
              g. If `pytest` PASSES: `gh pr merge <number> --squash --delete-branch`. Done.
              h. If `pytest` FAILS or never finishes: do NOT merge. Leave the PR OPEN, add a PR
                 comment pointing at the failing check, and stop so Michael can look. Before
                 starting a run, check `gh pr list --state open`; if a prior autonomous PR is
                 already open awaiting CI, help land/fix THAT instead of opening a new one.

            IF YOU GENUINELY FIND NOTHING worth a safe change: do NOT force one and do NOT open a
            PR. End your run by writing a short list of 2-3 specific, concrete ideas for next time.
          claude_args: |
            --append-system-prompt "You are the autonomous GitHub coding agent. One small improvement per run. Open a PR to main and squash-merge it yourself once the pytest CI check is green; if CI is red, leave the PR open and stop. Never push directly to main. Do NOT perform AGENTS.md local-agent rituals (no ghost blog entries, no GHOST_HANDOFF.md or blog_entries.json edits)."
            --permission-mode bypassPermissions
            --max-turns 120
