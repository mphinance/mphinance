<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #hero {
    position: relative;
    width: 2912px;
    height: 1632px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 1600px 1100px at 76% 78%, rgba(0,255,65,0.10), transparent 60%),
      radial-gradient(ellipse at 30% 20%, #0c151b 0%, #070b0f 55%, #04070a 100%);
    font-family: "Helvetica Neue", "Arial", sans-serif;
  }
  /* faint HUD grid */
  #hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px);
    background-size: 104px 104px;
    mask-image: radial-gradient(ellipse at 70% 70%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at 70% 70%, black 30%, transparent 80%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,0.55) 100%);
    z-index: 6;
  }

  svg.scene { position: absolute; inset: 0; width: 2912px; height: 1632px; z-index: 2; }

  /* top labels */
  .label {
    position: absolute; top: 88px; z-index: 5;
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    letter-spacing: 0.42em; text-transform: uppercase;
  }
  .label.left { left: 150px; font-size: 30px; color: #00ff41; }
  .label.left .dim { color: #5f7d6a; }
  .ticker {
    position: absolute; top: 80px; right: 150px; z-index: 5;
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    font-size: 30px; letter-spacing: 0.18em;
    color: #04070a; background: #00ff41;
    padding: 12px 26px; border-radius: 8px; font-weight: 700;
    box-shadow: 0 0 36px rgba(0,255,65,0.55);
  }

  .stack { position: absolute; left: 150px; top: 470px; z-index: 5; max-width: 1820px; }
  .kicker {
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    font-size: 30px; letter-spacing: 0.34em; text-transform: uppercase;
    color: #f0b400; margin-bottom: 38px;
  }
  .title {
    font-size: 150px; line-height: 1.04; font-weight: 800;
    letter-spacing: -0.022em; color: #f4f7f5; margin: 0;
    text-shadow: 0 6px 50px rgba(0,0,0,0.6);
  }
  .title .wave {
    color: #00ff41;
    text-shadow: 0 0 60px rgba(0,255,65,0.65), 0 0 18px rgba(0,255,65,0.5);
  }
  .rule { width: 132px; height: 5px; background: #f0b400; margin: 58px 0 44px; border-radius: 3px; }
  .sub {
    font-size: 46px; color: #cdd8d2; font-weight: 500; letter-spacing: 0.005em; margin: 0;
  }
  .sub .accent { color: #00ff41; font-weight: 700; }
  .attr {
    margin-top: 30px; font-size: 36px; font-style: italic; color: #7f968a; letter-spacing: 0.01em;
  }
  .attr::before { content: "— "; }
</style>
</head>
<body>
<div id="hero">
  <div class="label left">mphinance <span class="dim">// essay</span></div>
  <div class="ticker">NVDA &#9650;</div>

  <svg class="scene" viewBox="0 0 2912 1632" preserveAspectRatio="none">
    <defs>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#00ff41" stop-opacity="0.95"/>
        <stop offset="22%" stop-color="#06d94e" stop-opacity="0.72"/>
        <stop offset="60%" stop-color="#06906f" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#053a4a" stop-opacity="0.08"/>
      </linearGradient>
      <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#baffd0" stop-opacity="0.2"/>
        <stop offset="55%" stop-color="#eaffe0" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
      </linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- wave body: a swell rising to a crest at upper right -->
    <path d="M -60,1632 L -60,1330
             C 520,1250 980,1200 1380,1030
             C 1820,845 2090,560 2440,372
             C 2590,290 2780,268 2972,322
             L 2972,1632 Z"
          fill="url(#water)"/>

    <!-- crest highlight (foam line) -->
    <path d="M -60,1330
             C 520,1250 980,1200 1380,1030
             C 1820,845 2090,560 2440,372
             C 2590,290 2780,268 2972,322"
          fill="none" stroke="url(#crest)" stroke-width="9" filter="url(#glow)" stroke-linecap="round"/>

    <!-- spray off the crest -->
    <g fill="#eaffe0" filter="url(#glow)">
      <circle cx="2470" cy="338" r="9" opacity="0.9"/>
      <circle cx="2540" cy="300" r="6" opacity="0.8"/>
      <circle cx="2610" cy="330" r="7" opacity="0.75"/>
      <circle cx="2420" cy="392" r="5" opacity="0.7"/>
      <circle cx="2690" cy="296" r="5" opacity="0.6"/>
      <circle cx="2360" cy="430" r="6" opacity="0.6"/>
    </g>

    <!-- surfer riding the face of the wave -->
    <g transform="translate(2208,470) rotate(20)" filter="url(#glow)">
      <!-- board -->
      <ellipse cx="0" cy="86" rx="118" ry="15" fill="#04070a" stroke="#00ff41" stroke-width="3"/>
      <!-- body: crouched, leaning forward -->
      <path d="M -36,84
               L -22,30
               L -34,-14
               L -10,-30
               L 18,-6
               L 8,30
               L 40,52
               L 50,82"
            fill="none" stroke="#04070a" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M -36,84
               L -22,30
               L -34,-14
               L -10,-30
               L 18,-6
               L 8,30
               L 40,52
               L 50,82"
            fill="none" stroke="#00ff41" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="-16" cy="-46" r="20" fill="#04070a" stroke="#00ff41" stroke-width="6"/>
    </g>
  </svg>

  <!-- rising candlesticks: the trend that becomes the wave -->
  <svg class="scene" viewBox="0 0 2912 1632" style="z-index:3;" preserveAspectRatio="none" id="candles"></svg>

  <div class="stack">
    <div class="kicker">acceptance &middot; momentum &middot; recovery</div>
    <h1 class="title">You're not drowning.<br>You're fighting the <span class="wave">wave</span>.</h1>
    <div class="rule"></div>
    <p class="sub">Quit fading yourself. Find the direction you already trend, <span class="accent">and ride it.</span></p>
    <div class="attr">Momentum Phinance</div>
  </div>

  <div class="vignette"></div>
</div>

<script>
  // a clean uptrend of green candles marching into the base of the wave
  const svg = document.getElementById('candles');
  const NS = 'http://www.w3.org/2000/svg';
  const n = 16;
  const x0 = 150, step = 80, bodyW = 30;
  let baseY = 1492;        // first close
  let prevClose = baseY;
  for (let i = 0; i < n; i++) {
    const cx = x0 + i * step;
    const drift = 41 + Math.sin(i * 0.9) * 6;   // average rise per candle
    const open = prevClose;
    const close = open - drift;                 // higher = lower y
    prevClose = close;
    const top = Math.min(open, close) - (26 + (i % 3) * 10);   // upper wick
    const bot = Math.max(open, close) + (22 + (i % 2) * 9);    // lower wick
    const fade = 0.34 + i / n * 0.5;
    // wick
    const wick = document.createElementNS(NS, 'line');
    wick.setAttribute('x1', cx); wick.setAttribute('x2', cx);
    wick.setAttribute('y1', top); wick.setAttribute('y2', bot);
    wick.setAttribute('stroke', '#00ff41');
    wick.setAttribute('stroke-width', '3');
    wick.setAttribute('opacity', fade);
    svg.appendChild(wick);
    // body
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', cx - bodyW / 2);
    r.setAttribute('y', Math.min(open, close));
    r.setAttribute('width', bodyW);
    r.setAttribute('height', Math.max(8, Math.abs(close - open)));
    r.setAttribute('rx', '3');
    r.setAttribute('fill', '#00ff41');
    r.setAttribute('opacity', fade);
    svg.appendChild(r);
  }
</script>
</body>
</html>
